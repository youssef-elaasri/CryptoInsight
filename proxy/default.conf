server {
  listen 80;
  server_name localhost;
  
  location / {
    proxy_pass http://frontend-service:80/;
  }

  location /backend/ {
    proxy_pass http://backend-service:8080/;
  }

  location /cfgi {
    proxy_pass http://frontend-service:80/;
  }

  location /dominance {
    proxy_pass http://frontend-service:80/;
  }

}