name: CI/CD Pipeline

on:
  push:
    branches:
      - beta_version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Google Cloud CLI
        run: |
          sudo apt-get update && sudo apt-get install -y google-cloud-cli
      

      - name: Authenticate with Google Cloud
        run: |
          echo '${{ secrets.GCLOUD_AUTH }}' > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV

      - name: Configure Docker to use Google Artifact Registry
        run: |
          gcloud auth configure-docker europe-west12-docker.pkg.dev

      - name: Install Docker Compose
        run: |
          DOCKER_COMPOSE_VERSION=2.27.0
          sudo curl -L "https://github.com/docker/compose/releases/download/v$DOCKER_COMPOSE_VERSION/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Build and Push Docker Images
        run: |
          docker-compose build
          docker-compose push

      - name: Install Terraform
        run: |
          sudo apt-get update && sudo apt-get install -y terraform
          terraform version

      - name: Initialize Terraform
        run: |
          cd terraform
          terraform init

      - name: Apply Terraform
        run: |
          cd terraform
          terraform apply -target=google_container_cluster.primary -lock=false -auto-approve
          terraform apply -lock=false -auto-approve