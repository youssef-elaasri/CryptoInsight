name: CI/CD Pipeline

on:
  push:
    branches:
      - beta_version

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          DOCKER_COMPOSE_VERSION=2.27.0  # Set the latest stable version
          sudo curl -L "https://github.com/docker/compose/releases/download/v$DOCKER_COMPOSE_VERSION/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version  # Verify installation

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u jihadhd --password-stdin

      - name: Build Docker Images
        run: docker-compose build

      - name: Push Docker Images
        run: docker-compose push

      - name: Authenticate with Google Cloud
        run: |
          echo '${{ secrets.GCLOUD_AUTH }}' > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init

      - name: Apply Terraform (Cluster)
        run: cd terraform | terraform apply -target=google_container_cluster.primary -lock=false -auto-approve

      - name: Apply Terraform (Full)
        run: terraform apply -lock=false -auto-approve