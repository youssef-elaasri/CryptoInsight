apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastreaming
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datastreaming
  template:
    metadata:
      labels:
        app: datastreaming
    spec:
      containers:
        - name: datastreaming
          image: jihadhd/cryptoinsight-datastreaming:latest
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "500m"
              memory: "4Gi"
              ephemeral-storage: "2Gi"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              value: "kafka-service:9092"
            - name: TOPIC
              value: "assets"
